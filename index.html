<!DOCTYPE html>
<html>
<head>
  <title>Gomoku - Two Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="turnText">🎮 Gomoku – Two Players</h2>
<canvas id="board" width="400" height="400"></canvas>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="restartBtn">Restart</button>
</div>

<div id="resultBox">
  <h3 id="resultText">Press Start Game</h3>
<p>🔵 Player Blue: <span id="blackScore">0</span></p>
<p>🌺 Player Pink: <span id="whiteScore">0</span></p>
</div>

<script src="script.js"></script>
</body>
</html>
